<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video examples, in my editing style - Ayanna Edwards</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #FFF7E9; color: #241A3D; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 32px 20px 40px; }
  .kicker { color: #E85D4F; font-weight: 800; letter-spacing: 0.08em; font-size: 13px; }
  h1 { margin: 8px 0 28px; font-size: 32px; line-height: 1.15; }
  .layout { display: flex; gap: 20px; align-items: center; justify-content: center; }
  .pockets { display: flex; flex-direction: column; gap: 14px; width: 110px; flex-shrink: 0; }
  .pocket { border-radius: 18px; padding: 16px 12px; text-align: center; font-weight: 700; font-size: 13px; line-height: 1.35; }
  .pocket.pink { background: #F6C3CE; }
  .pocket.mint { background: #D6F0D8; }
  .pocket.peach { background: #FDE8C8; }
  .phones { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  .phone { width: 240px; }
  .frame { background: #5C2A5C; border-radius: 26px; padding: 9px; }
  .frame video { display: block; width: 100%; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 18px; background: #000; }
  .cap { text-align: center; margin-top: 10px; font-size: 13px; line-height: 1.4; }
  .cap b { display: block; }
  .cap span { color: #6B6480; }
  @media (max-width: 820px) {
    h1 { font-size: 26px; }
    .layout { flex-direction: column; }
    .pockets { width: 100%; flex-direction: row; }
    .pocket { flex: 1; }
    .phone { width: min(240px, 30vw); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">VIDEO EXAMPLES</div>
  <h1>Video examples, in my editing style.</h1>
  <div class="layout">
    <div class="pockets">
      <div class="pocket pink">Style examples only, not church work</div>
      <div class="pocket peach">Tap a phone to play</div>
    </div>
    <div class="phones">
      <div class="phone">
        <div class="frame"><video controls playsinline preload="metadata" poster="poster1.jpg" src="video1.mp4"></video></div>
        <div class="cap"><b>Ranking countries for traveling with kids</b><span>22 seconds</span></div>
      </div>
      <div class="phone">
        <div class="frame"><video controls playsinline preload="metadata" poster="poster2.jpg" src="video2.mp4"></video></div>
        <div class="cap"><b>What a normal childhood looks like</b><span>31 seconds</span></div>
      </div>
      <div class="phone">
        <div class="frame"><video controls playsinline preload="metadata" poster="poster3.jpg" src="video3.mp4"></video></div>
        <div class="cap"><b>Just say yes to everything</b><span>11 seconds</span></div>
      </div>
    </div>
    <div class="pockets">
      <div class="pocket mint">Same editing for your sermon and event footage</div>
    </div>
  </div>
</div>
</body>
</html>
